<!DOCTYPE html>
<html>
<head>
  <title>Expense Tracker</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f4f6f8; margin: 0; }
    nav { background: #2c3e50; color: white; padding: 14px 30px; display: flex; justify-content: space-between; align-items: center; }
    nav a, nav button { color: white; margin-left: 15px; text-decoration: none; background: none; border: none; font-size: 16px; cursor: pointer; }
    .container { max-width: 900px; margin: 25px auto; background: white; padding: 25px; border-radius: 8px; }
    table { width: 100%; border-collapse: collapse; margin-top: 15px; }
    th, td { padding: 10px; border-bottom: 1px solid #ddd; text-align: left; }
    .btn { background: #27ae60; color: white; padding: 8px 14px; border-radius: 5px; text-decoration: none; border: none; cursor: pointer; }
    .btn-red { background: #c0392b; }
    .charts { display: flex; gap: 20px; flex-wrap: wrap; }
    .charts > div { flex: 1; min-width: 300px; }
    input, select { padding: 8px; margin: 5px 0; width: 100%; box-sizing: border-box; }
  </style>
</head>
<body>
  <nav>
    <b>Expense Tracker</b>
    <div>
      {% if user.is_authenticated %}
        <a href="{% url 'dashboard' %}">Dashboard</a>
        <a href="{% url 'add_expense' %}">Add</a>
        <a href="{% url 'export_csv' %}">Export CSV</a>
        <form method="post" action="{% url 'logout' %}" style="display:inline">
          {% csrf_token %}<button type="submit">Logout ({{ user.username }})</button>
        </form>
      {% else %}
        <a href="{% url 'login' %}">Login</a>
        <a href="{% url 'signup' %}">Signup</a>
      {% endif %}
    </div>
  </nav>
  <div class="container">{% block content %}{% endblock %}</div>
</body>
</html>
