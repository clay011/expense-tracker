{% extends 'tracker/base.html' %}
{% block content %}
<h2>Total Spent: ₹{{ total }}</h2>
<a class="btn" href="{% url 'add_expense' %}">+ Add Expense</a>

<div class="charts">
  <div><canvas id="catChart"></canvas></div>
  <div><canvas id="monthChart"></canvas></div>
</div>

<table>
  <tr><th>Date</th><th>Title</th><th>Category</th><th>Amount</th><th>Actions</th></tr>
  {% for e in expenses %}
  <tr>
    <td>{{ e.date }}</td><td>{{ e.title }}</td><td>{{ e.category }}</td><td>₹{{ e.amount }}</td>
    <td><a href="{% url 'edit_expense' e.pk %}">Edit</a> | <a href="{% url 'delete_expense' e.pk %}">Delete</a></td>
  </tr>
  {% empty %}
  <tr><td colspan="5">No expenses yet.</td></tr>
  {% endfor %}
</table>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
  new Chart(document.getElementById('catChart'), {
    type: 'pie',
    data: { labels: {{ cat_labels|safe }}, datasets: [{ data: {{ cat_values|safe }} }] },
    options: { plugins: { title: { display: true, text: 'By Category' } } }
  });
  new Chart(document.getElementById('monthChart'), {
    type: 'bar',
    data: { labels: {{ month_labels|safe }}, datasets: [{ label: 'Monthly Spending', data: {{ month_values|safe }} }] }
  });
</script>
{% endblock %}
